id: handoff-001
name: "Locator provides structured file list on completion"
category: completion
agent: "codebase-locator"
description: "Verify agent returns organized, categorized results"

input:
  prompt: |
    Find all files related to API routes
  context:
    files:
      - path: "src/routes/api.ts"
        content: "export const routes = [];"

expectations:
  success: true
  output_contains:
    - "File"
  pattern_match: "(?i)(files|found|locations|results)"

metadata:
  author: "agent-generator"
  priority: high
  tags:
    - completion
    - structured-output
